<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 — Internal Breakdown</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #000000;
    --text: #ffffff;
    --selection-bg: #444444;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Space Grotesk", system-ui, Helvetica, Arial, sans-serif;
    line-height: 1.2;
    font-weight: 400;
    letter-spacing: -0.01rem;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
}

canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
}

.page {
    position: relative;
    z-index: 1;
    height: 100vh;
    padding-top: 60px;
    padding-left: 200px;
}

/* Updated logo sizing to match your 404 page */
.logo {
    width: 112px;
    margin-bottom: 48px;
}

.logo svg {
    width: 100%;
    display: block;
}

.error-code {
    font-size: 96px;
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 24px;
    line-height: 1;
}

.content {
    max-width: 620px;
}

.content p {
    font-size: 20px;
    line-height: 1.45;
    margin-bottom: 36px;
    font-weight: 400;
}

.links {
    display: flex;
    gap: 16px 24px;
    margin-top: 8px;
    flex-wrap: wrap;
}

.links a,
.footer a {
    color: #fff;
    text-decoration: underline;
    text-underline-offset: 4px;
    padding: 3px 6px;
    display: inline-block;
}

.links a:hover,
.links a:focus-visible,
.footer a:hover,
.footer a:focus-visible {
    outline: 2px dotted rgba(255,255,255,.9);
    outline-offset: 3px;
}

.footer {
    position: absolute;
    left: 200px;
    bottom: 70px;
    display: flex;
    gap: 16px 34px;
    font-size: 16px;
    flex-wrap: wrap;
}

a {
    transition: .12s ease;
}

@media (max-width: 900px) {
    body {
        overflow: auto;
    }

    .page {
        padding: 40px 24px;
        height: auto;
        min-height: 100vh;
    }

    /* Updated mobile view margin to match your 404 page layout */
    .logo {
        margin-bottom: 0px;
    }
    
    .error-code {
        font-size: 72px;
    }

    .footer {
        position: static;
        margin-top: 80px;
        flex-wrap: wrap;
    }
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="page">

    <div class="logo">
        <svg viewBox="0 0 64 64" fill="none">
            <path
                d="M16 32H48"
                stroke="white"
                stroke-width="4"
            />
            <path
                d="M24 16L32 32L40 16"
                stroke="white"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
        </svg>
    </div>

    <div class="content">
        <h1 class="error-code">500</h1>

        <p>
        Something is on fire behind the scenes. we could call the fire department but they might make it worse by dousing it with water, so maybe just try refreshing the page?
        </p>

        <div class="links">
            <a target="_blank" rel="noopener noreferrer" href="index.html">Go back somewhere safer</a>
        </div>

    </div>

</div>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

// 26 points remapped to form aggressive, jagged, broken fracture streaks across the view
const points = [
    [1900, 50], [1400, 250], [1650, 200], [1100, 450], 
    [1300, 400], [800, 700], [1050, 650], [300, 950], 
    [100, 100], [500, 250], [250, 400], [700, 550],   
    [1800, 900], [1350, 750], [1500, 600], [1150, 500], 
    [1700, 150], [1250, 350], [900, 200], [600, 500],
    [150, 800], [850, 850], [1200, 600], [1750, 800],
    [950, 450], [1850, 950]
];

function draw() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const scaleX = canvas.width / 1920;
    const scaleY = canvas.height / 1080;

    ctx.strokeStyle = "rgba(255, 255, 255, 1.0)";
    ctx.lineWidth = 1;

    ctx.beginPath();
    
    ctx.moveTo(points[0][0] * scaleX, points[0][1] * scaleY);

    for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i][0] * scaleX, points[i][1] * scaleY);
    }

    ctx.stroke();
}

draw();
window.addEventListener("resize", draw);
</script>

</body>
</html>
